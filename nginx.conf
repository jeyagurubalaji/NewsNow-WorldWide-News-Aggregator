worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Upstream definition for Express Backend
    upstream backend_service {
        server 127.0.0.1:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. FRONTEND: Serve built React assets
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            # Fallback to index.html for React Router SPA routes (/login, /reset-password, etc.)
            try_files $uri $uri/ /index.html;
        }

        # 2. BACKEND API: Reverse proxy to Express API endpoints
        location /api/ {
            proxy_pass http://backend_service;
            proxy_http_version 1.1;

            # Forward client headers
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Disable proxy caching for live API data
            proxy_cache_bypass $http_upgrade;
        }

        # Static asset caching rules
        location ~* \.(?:css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            root /usr/share/nginx/html;
            expires 30d;
            add_header Cache-Control "public, no-transform";
        }

        # Global error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}